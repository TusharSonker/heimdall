version: "3.9"

services:
  backend:
    build: ./backend
    container_name: heimdall-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: heimdall-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
